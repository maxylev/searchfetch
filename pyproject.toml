[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "searchfetch"
version = "3.3.4"
description = "A maximum fault-tolerant, stealth-enabled MCP server for web searching and fetching."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Max" }
]
keywords = ["mcp", "search", "fetch", "llm", "ai", "agent", "stealth"]
dependencies = [
    "mcp>=2.2.0",
    "cloakbrowser>=0.5.10",
    "beautifulsoup4>=4.15.0",
    "markdownify>=1.2.3",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "soupsieve>=2.9.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[project.urls]
Homepage = "https://github.com/maxylev/searchfetch"
Repository = "https://github.com/maxylev/searchfetch"

[project.scripts]
searchfetch = "server:main"

[tool.setuptools]
py-modules = ["server", "selectors_utils"]

packages = ["searchfetch_templates"]
package-dir = { searchfetch_templates = "templates" }

[tool.setuptools.package-data]
searchfetch_templates = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
