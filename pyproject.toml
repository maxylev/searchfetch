[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[project]
name = "searchfetch"
version = "4.0.0"
description = "Fault-tolerant MCP server for stealth web search and page fetching"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11.5"
authors = [{ name = "Max" }]
keywords = ["mcp", "search", "fetch", "llm", "ai", "agent", "stealth"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cloakbrowser>=0.6.3",
    "markdownify>=1.2.3",
    "mcp>=2.3.0",
    "playwright>=1.64.0",
    "pydantic>=2.14.1",
    "soupsieve>=3.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.17.1"]

[project.urls]
Homepage = "https://github.com/maxylev/searchfetch"
Repository = "https://github.com/maxylev/searchfetch"

[project.scripts]
searchfetch = "searchfetch.server:main"

[tool.hatch.build.targets.wheel]
packages = ["searchfetch"]

# Templates live at the repository root so both runtimes share them; bundle them in the wheel.
[tool.hatch.build.targets.wheel.force-include]
"templates" = "searchfetch/templates"

[tool.hatch.build.targets.sdist]
include = ["searchfetch/", "templates/", "tests/", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
