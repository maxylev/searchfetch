name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, test, build, and E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.x"
          cache: npm

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          npm ci
          uv sync --locked --extra dev

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Package dry run
        run: npm pack --dry-run

      - name: Build Python package
        run: uv build

      - name: MCP E2E tests
        run: npm run e2e

  python-minimum:
    name: Python 3.11 unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Unit tests
        run: uv run --locked --extra dev pytest
