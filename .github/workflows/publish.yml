name: Publish

# Pushing a version tag (e.g. `git push origin v4.0.0`) verifies, publishes to npm and PyPI,
# then creates the GitHub Release. Use "Run workflow" with a tag to retry an existing tag.
# A release created with GITHUB_TOKEN cannot trigger other workflows, so everything runs here.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v4.0.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify version and run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Check tag matches package versions
        run: |
          npm_version="$(node -p "require('./package.json').version")"
          py_version="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          echo "tag=$TAG npm=$npm_version pypi=$py_version"
          if [ "$TAG" != "v$npm_version" ] || [ "$TAG" != "v$py_version" ]; then
            echo "::error::Tag $TAG does not match package.json ($npm_version) and pyproject.toml ($py_version)"
            exit 1
          fi
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.x"
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install dependencies
        run: |
          npm ci
          uv sync --locked --extra dev
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test

  build-python:
    name: Build Python distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Build a binary wheel and a source tarball
        run: uv build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  publish-npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: npm ci
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    needs: build-python
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/searchfetch
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: python-dist
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2

  github-release:
    name: Create GitHub Release
    needs: [publish-npm, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: python-dist
          path: dist/
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets only."
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$TAG" --generate-notes
          fi
